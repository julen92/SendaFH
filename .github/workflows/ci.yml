name: SendaFH checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: sendafh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Spanish locales, modules and guides
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: Translation and module tests
        run: node --test tests/i18n.test.js tests/engine-l10n.test.js tests/names.test.js tests/sendafh-modules.test.js
      - name: Spanish layout tests
        env:
          SENDA_TEST_LOCALE: esES
        run: node --test tests/text-fit.test.js
      - name: Locale coverage
        run: node tools/senda-locale-audit.js
      - name: Guide coverage
        run: node tools/senda-guide-audit.js
      - name: Navigation integrity
        run: node tools/sendafh.js nav check

