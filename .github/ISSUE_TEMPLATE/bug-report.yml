name: "Fallo del addon"
description: "Un error Lua o algo de SendaFH que no funciona."
title: "[Fallo] "
body:
  - type: input
    id: version
    attributes:
      label: "Versión de SendaFH"
      description: "Aparece en la lista de addons y en los ajustes de SendaFH."
      placeholder: "0.5.0-test.1"
    validations:
      required: true
  - type: dropdown
    id: idioma
    attributes:
      label: "Idioma del cliente"
      options:
        - "Español (España) — esES"
        - "Español (Latinoamérica) — esMX"
        - "Otro"
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: "Qué ha pasado"
      description: "Cuenta qué esperabas y qué ha ocurrido."
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: "Cómo repetir el fallo"
      placeholder: |
        1. Abro la guía…
        2. Pulso…
        3. Aparece…
    validations:
      required: true
  - type: textarea
    id: informe
    attributes:
      label: "Informe de SendaFH o error Lua"
      description: "Usa /senda report para copiar el informe. Si hay un error Lua, pega el texto completo."
      render: text
  - type: textarea
    id: contexto
    attributes:
      label: "Capturas y otros addons"
      description: "Puedes arrastrar una captura aquí y decir qué otros addons llevas activos."
