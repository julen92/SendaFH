name: "Paso o ruta incorrectos"
description: "Un objetivo que no cuenta, un NPC mal situado o una flecha que te manda por mal camino."
title: "[Guía] "
body:
  - type: input
    id: version
    attributes:
      label: "Versión de SendaFH"
      placeholder: "0.5.0-test.1"
    validations:
      required: true
  - type: input
    id: guia
    attributes:
      label: "Guía y número de paso"
      placeholder: "Bosque de Elwynn, paso 4"
    validations:
      required: true
  - type: input
    id: personaje
    attributes:
      label: "Raza, clase y nivel"
      placeholder: "Humano, cazador, nivel 8"
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: "Qué indica la guía y qué has encontrado"
      description: "Explica si falla el NPC, el objetivo, la entrega o el camino de la flecha."
    validations:
      required: true
  - type: textarea
    id: informe
    attributes:
      label: "Informe del paso"
      description: "Con el paso en pantalla, usa /senda report y pega el informe."
      render: text
  - type: textarea
    id: ubicacion
    attributes:
      label: "Ubicación correcta y capturas"
      description: "Si conoces el sitio, usa /senda where allí y pega el resultado. Puedes adjuntar capturas."
