name: "Proponer una mejora"
description: "Una idea para que SendaFH ayude más mientras juegas."
title: "[Mejora] "
body:
  - type: textarea
    id: necesidad
    attributes:
      label: "Qué te gustaría poder hacer"
      description: "Cuéntanos en qué situación te vendría bien."
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: "Tu propuesta"
      description: "Cómo te gustaría que funcionase dentro del juego."
    validations:
      required: true
  - type: textarea
    id: ejemplos
    attributes:
      label: "Ejemplos o capturas"
